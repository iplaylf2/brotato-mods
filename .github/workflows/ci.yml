name: Portable checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Install locked development tools
        run: uv sync --locked
      - name: Run portable checks
        run: uv run --locked tools/tasks.py lint-portable
